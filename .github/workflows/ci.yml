name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Install locked dependencies and repair SDK imports
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Node regression tests
        run: npm test

      - uses: actions/setup-python@v7
        if: runner.os == 'Windows'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/ecosystem/wechat/windows/requirements.txt

      - name: Install WeChat adapter dependencies
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check -r src/ecosystem/wechat/windows/requirements.txt

      - name: WeChat offline regression tests
        if: runner.os == 'Windows'
        working-directory: src/ecosystem/wechat/windows
        run: python -m unittest discover -s . -p 'test_*.py' -v

      - name: Build compiled package
        run: npm run build

      - name: Pack checked build
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts

      - name: Install and smoke-test the packed plugin
        run: npm run test:package

      - name: Upload tested package
        uses: actions/upload-artifact@v7
        with:
          name: dsh-world-${{ runner.os }}-node22
          path: artifacts/*.tgz
          if-no-files-found: error
